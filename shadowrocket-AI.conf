# ══ L2c Cursor / Grok Bot → ai ══ 必须排在 Google / Microsoft / Apple 之前
# 官方域名清单：https://cursor.com/docs/grok-bot/proxies
#               https://cursor.com/docs/enterprise/network-configuration
# L2c 保持内联 DOMAIN-SUFFIX：单文件清晰、少一次远程拉取，可靠性更好（非因仓库私有）。
# 同源列表：rules/shadowrocket/cursor.list（维护用；需要时可改 RULE-SET 引用）
# DOMAIN-SUFFIX,cursorvm.com 已覆盖嵌套 *.*.cursorvm.com；勿放进 L4 国内直连。
DOMAIN-SUFFIX,cursor.sh,ai
DOMAIN-SUFFIX,cursorvm.com,ai
DOMAIN-SUFFIX,cursor.com,ai
DOMAIN-SUFFIX,cursor-cdn.com,ai
DOMAIN-SUFFIX,cursorapi.com,ai
DOMAIN,accounts.x.ai,ai
DOMAIN,accounts.spacex.ai,ai
DOMAIN-SUFFIX,spacex.ai,ai
DOMAIN,connectors-gateway.grok.com,ai
DOMAIN,auth.grokusercontent.com,ai
DOMAIN-SUFFIX,grokipedia.com,ai
# api5 / gcpp 裸名在公网 DNS 为 NXDOMAIN；用实测可通的主机（DOMAIN-SUFFIX,cursor.sh 已覆盖，下列显式标注）
DOMAIN-KEYWORD,api5.cursor.sh,ai
DOMAIN,us-only.gcpp.cursor.sh,ai
DOMAIN,anysphere-binaries.s3.us-east-1.amazonaws.com,ai

# ══ L3 大分类 ══
RULE-SET,https://raw.githubusercontent.com/s1-team/rules/main/rules/shadowrocket/proxy.list,节点选择
RULE-SET,https://raw.githubusercontent.com/s1-team/rules/main/rules/shadowrocket/vendor-direct.list,DIRECT

# ══ L4 国内直连 ══
RULE-SET,https://raw.githubusercontent.com/s1-team/rules/main/rules/shadowrocket/china.list,DIRECT
GEOIP,CN,DIRECT

# ══ L5 兜底 ══
FINAL,节点选择
